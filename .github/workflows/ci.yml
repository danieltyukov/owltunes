name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Style checker tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Style check
        run: python3 tools/check_style.py

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Host unit tests
        run: tools/test_host.sh

  simulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Golden image tests
        run: tools/sim.sh
      - name: Upload rendered screens on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screens
          path: build/sim/out

  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          tools/firmware.sh build
