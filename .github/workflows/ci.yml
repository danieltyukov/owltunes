name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Style checker tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Style check
        run: python3 tools/check_style.py

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Host unit tests
        run: tools/test_host.sh

  simulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Golden image tests
        run: tools/sim.sh
      - name: Upload rendered screens on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-screens
          path: build/sim/out

  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v7
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          tools/firmware.sh build
      - name: Install QEMU
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          python3 "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
      - name: Boot and setup protocol in QEMU
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          tools/qemu_smoke.sh
          tools/qemu_prov_test.py
      - name: Upload QEMU logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-logs
          path: |
            build/qemu-smoke.log
            build/qemu-prov
