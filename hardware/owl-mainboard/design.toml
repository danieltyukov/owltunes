# J301 takes VIEWE's standard adapter FPC3-HD143Y002M (straight through, 31 contacts at 0.3 mm)
# at rotation 270 on the front. The adapter's U-turn turns its contacts to face the board, as the
# bottom-contact FH26W needs, and J301's pins run the other way along the band from the panel's,
# so connector pin k carries panel pin 32 - k, as on the Waveshare ESP32-S3-Touch-AMOLED-1.75 J3.
# Panel pins (VIEWE ALL-UEOL018VG-RA31-A001A spec V1.1 page 7): 1 GND, 2 TP_INT, 3 TP_RST,
# 4 TP_SDA, 5 TP_SCL, 6 TP_3.3V, 7 GND, 8 IOVCC, 9 VCI, 10 VBAT, 11 VCI_EN, 12 GND, 13 MTP_PWR
# (open), 14 RESET, 15 CSX, 16 SDI = QSPI D0, 17 DCX = QSPI D1, 18 SCL, 19 D(1) = QSPI D3,
# 20 D(0) = QSPI D2, 21 TE, 22 GND, 23 to 30 MIPI (open), 25 and 28 GND, 31 GND.
# Panel supplies (ruling R18): VCI, IOVCC, VCI_EN, VBAT and TP_3.3V all run from DISP_3V3. The
# touch lines (panel pins 2 to 5) are at 1.8 V, on the panel side of U305 (TP_*_1V8, below).
# VBAT stays an open item: VIEWE is still being asked whether the pin wants 3.3 V or 3.7 to 4.5 V.
# The application circuit (page 12) gives 3.3 to 5.5 V, the pin table (page 7) 3.7 to 4.5 V (VSYS
# bodge to VBAT possible at bring-up).
