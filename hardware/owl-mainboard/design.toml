# OwlTunes main board rev A: every part, its source and its pin-to-net map.
# tools/hw/hw_netlist.py checks the KiCad schematic against this file; tools/hw/hw_bom.py checks
# the LCSC and MPN fields; tools/tests/test_hw_design.py checks the design rules below.
# Heights are millimetres above the board surface. Prices live in private/, never here.
# rotation_offset is the schematic field "FT Rotation Offset" (degrees) that the Fabrication
# Toolkit adds to a part's CPL rotation, so JLC places the part the way its EasyEDA footprint
# (JLC's zero) maps onto the KiCad footprint; each one is set from a pad-by-pad match of the two
# footprints (Task 12 part B, 12 October 2026) and confirmed in JLC's placement preview. A part
# switched to its alt has its own EasyEDA footprint, so its offset must be derived again.
# position_offset is the field "FT Position Offset" ("x,y" in mm, footprint frame) that moves the
# CPL point from the KiCad anchor to the EasyEDA footprint's origin, found by the same match.
board = "owl-mainboard"

