# Battery (controller rulings, 11 October 2026): a 2-wire 803030 class LiPo (efaso 803030 740 mAh,
# or EEMB 803030 700 mAh with a confirmed PH 2.0 plug) with a protection circuit and a JST PH 2.0
# plug, in the cavity drawn for an 803040 (docs/hardware/assembly.md step 8). The BQ24073 does not
# charge with TS open, so the board carries its own NTC, RT101, on the back under the cell; a pack's
# own NTC wire, if it has one, is not used.
# RT101 is a 10k NTC with B25/50 3950 K, 1 % on R25 and on B (controller ruling, 11 October 2026).
# It is steeper than the 103AT-2 curve the TS thresholds assume, so the charge window narrows from
# about -0.6 to 51 C to +3.5 to 47.2 C on the B25/50 model (VCOLD 2.1 V and VHOT 0.30 V at 75 uA:
# 28.0k and 4.0k; docs/hardware/rev-a.md has the tolerances). Resistors on TS can only widen the
# window. Keep 1 % B: a 3 % B, 5 % R part spreads the hot cut-off by +-2 C, not +-0.5 C. No 10k
# NTC is Basic or Preferred at JLC (checked 2026-10-11); this Sunlord part is Extended, stock 184396
# on 2026-10-11. Height: 0.5 +- 0.15 mm (Sunlord SDNT1005).
[[part]]
ref = "J101"
sheet = "power"
symbol = "Connector_Generic_MountingPin:Conn_01x02_MountingPin"
footprint = "Connector_JST:JST_PH_S2B-PH-SM4-TB_1x02-1MP_P2.00mm_Horizontal"
value = "Battery +, -"
lcsc = "C295747"
mpn = "S2B-PH-SM4-TB(LF)(SN)"
manufacturer = "JST"
alt = "C3029440 XUNPU WAFER-PH2.0-2PWB, check the footprint"
# EasyEDA's C295747 footprint matches KiCad's at zero; this cancels the toolkit's ^JST_PH_S rule (180)
rotation_offset = 180
side = "back"
height = 4.8
pins = { 1 = "VBAT", 2 = "GND", MP = "GND" }

