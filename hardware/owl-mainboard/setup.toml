# Stackup, origins, JLCPCB minimum rules and net classes for the owl main board.
# Applied by tools/hw/hw_setup.py. JLCPCB 4-layer capability: 0.09 mm track and gap; vias with a
# 0.3 mm drill and 0.5 mm pad carry no extra fee.
copper_layers = 4
thickness_mm = 1.0
origin_mm = [100.0, 100.0]

# JLCPCB 4-layer 1.0 mm FR-4, ENIG. Layer thicknesses follow the JLC04101H-7628 build (35 um outer
# copper, 7628 prepreg 0.2104 mm, 15.2 um inner copper); the core is 0.4788 mm so the stack adds up
# to 1.0 mm. Confirm the core against JLCPCB's impedance page (https://jlcpcb.com/impedance) on the
# order day.
[stackup]
finish = "ENIG"

[[stackup.layer]]
name = "F.Cu"
type = "copper"
thickness = 0.035

[[stackup.layer]]
type = "prepreg"
thickness = 0.2104
material = "7628"
epsilon_r = 4.4

[[stackup.layer]]
name = "In1.Cu"
type = "copper"
thickness = 0.0152

[[stackup.layer]]
type = "core"
thickness = 0.4788
material = "FR4"
epsilon_r = 4.6

[[stackup.layer]]
name = "In2.Cu"
type = "copper"
thickness = 0.0152

[[stackup.layer]]
type = "prepreg"
thickness = 0.2104
material = "7628"
epsilon_r = 4.4

[[stackup.layer]]
name = "B.Cu"
type = "copper"
thickness = 0.035

[rules]
min_clearance = 0.1
min_track_width = 0.1
min_via_diameter = 0.5
min_through_hole_diameter = 0.3
min_via_annular_width = 0.1
min_copper_edge_clearance = 0.3
min_hole_clearance = 0.25
min_hole_to_hole = 0.25
min_text_height = 0.8
min_text_thickness = 0.15

[netclass.Default]
track_width = 0.15
clearance = 0.15
via_diameter = 0.5
via_drill = 0.3

[netclass.Power]
track_width = 0.5
clearance = 0.2
via_diameter = 0.6
via_drill = 0.3
nets = ["GND", "+3V3", "DISP_3V3", "VSYS", "VBAT", "VIN_CHG", "VBUS_USB", "VBUS_DOCK", "TPS_L1", "TPS_L2"]

[netclass.Fine]
track_width = 0.1
clearance = 0.1
via_diameter = 0.5
via_drill = 0.3
nets = ["LCD_*", "TP_*"]

[netclass.USB]
track_width = 0.2
clearance = 0.15
via_diameter = 0.5
via_drill = 0.3
nets = ["USB_DP", "USB_DM", "USB_DP_CONN", "USB_DM_CONN"]
