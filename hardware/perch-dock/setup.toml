# Stackup, origins, JLCPCB minimum rules and net classes for the perch board (2 layers).
# Applied by tools/hw/hw_setup.py. JLCPCB 2-layer capability: 0.127 mm track and gap.
copper_layers = 2
thickness_mm = 1.6
origin_mm = [100.0, 100.0]

[rules]
min_clearance = 0.15
min_track_width = 0.15
min_via_diameter = 0.6
min_through_hole_diameter = 0.3
min_via_annular_width = 0.15
min_copper_edge_clearance = 0.3
min_hole_clearance = 0.25
min_hole_to_hole = 0.25
min_text_height = 0.8
min_text_thickness = 0.15

[netclass.Default]
track_width = 0.25
clearance = 0.2
via_diameter = 0.6
via_drill = 0.3

[netclass.Power]
track_width = 0.8
clearance = 0.25
via_diameter = 0.8
via_drill = 0.4
nets = ["GND", "VBUS_IN", "VBUS_OUT", "PAD_GND", "PAD_VBUS"]
